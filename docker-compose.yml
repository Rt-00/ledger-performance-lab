# Each service gets fixed CPU/memory so experiments are repeatable and the load generator (k6,
# running on the host) does not steal CPU from the system under test.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports: ["5432:5432"]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  app:
    build: .
    profiles: ["app"]
    ports: ["8080:8080"]
    cpus: 2
    mem_limit: 1g
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_RABBITMQ_HOST: rabbitmq
      LEDGER_LOCK_MODE: ${LEDGER_LOCK_MODE:-pessimistic}
      SPRING_THREADS_VIRTUAL_ENABLED: ${VIRTUAL_THREADS:-true}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SPRING_FLYWAY_TARGET: ${FLYWAY_TARGET:-latest}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
